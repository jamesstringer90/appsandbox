[org/gnome/shell]
enabled-extensions=['appsandbox-pointer@appsandbox']
# The extension lists the GNOME versions it was written for (Ubuntu's); a
# rolling distro is always ahead, and an "OUT OF DATE" extension is never loaded.
disable-extension-version-validation=true

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/screensaver]
lock-enabled=false
idle-activation-enabled=false

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='nothing'
idle-dim=false
power-button-action='nothing'
