# Audio sink on the snd-aloop playback side. appsandbox-audio captures the other
# side (hw:Loopback,1,0) and holds it open from boot; WirePlumber's ALSA monitor
# then logs "card 0 unavailable (Device or resource busy)" and never creates a
# sink, so apps play into the dummy output. Create the sink directly instead.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "appsandbox-loopback"
            node.description       = "AppSandbox Audio"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:Loopback,0,0"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            priority.session       = 3000
            priority.driver        = 3000
        }
    }
]
